[package]
name = "alvio-ocr"
version = "0.2.2"
edition = "2021"
authors = ["Alvio"]
description = "High-performance OCR and Document AI library powered by ONNX Runtime (PP-OCRv6). Feature-complete with orientation deskew, confidence 2nd-pass re-OCR, KTP/receipt/table schemas, and per-stage profiling."
license = "MIT"
readme = "README.md"
repository = "https://github.com/piyoxz/alvio-ocr"
keywords = ["ocr", "onnx", "text-recognition", "document-ai", "paddleocr"]
categories = ["computer-vision", "text-processing"]
exclude = [
    "models/*",
    "libs/*",
    "*.onnx",
    "*.dll",
    "*.so",
    "*.dylib",
    "*.tgz",
]

[dependencies]
ort = { version = "=2.0.0-rc.10", features = ["download-binaries", "copy-dylibs", "ndarray"] }
ndarray = "0.16"

image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "bmp", "tiff"] }
imageproc = "0.25"
fast_image_resize = "6"

rayon = "1.10"
num_cpus = "1.16"

ureq = { version = "2.10", default-features = false, features = ["tls"] }

thiserror = "2.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
parking_lot = "0.12"
tracing = "0.1"

pdfium-render = { version = "0.8", optional = true }

[features]
default = []
pdf = ["dep:pdfium-render"]
cuda = ["ort/cuda"]
directml = ["ort/directml"]

[[example]]
name = "simple_ocr"
path = "examples/simple_ocr.rs"

[[example]]
name = "pdf_ocr"
path = "examples/pdf_ocr.rs"
required-features = ["pdf"]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = "symbols"
